[project]
name = "fusion-model-hub"
version = "1.0.15"
description = "Fusion-Model-Hub — Unified model repository & manager for the Fusion-MLX ecosystem"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "prometheus_client>=0.20.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
fusion-model-hub = "fusion_model_hub.server.__main__:main"
fmh = "fusion_model_hub.cli.main:cli_main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF", "ASYNC", "S"]
ignore = [
    "BLE001",
    "B008",
    "B904",
    "UP042",
    "ASYNC230",
    "ASYNC240",
    "S104",
    "S110",
    "S311",
    "E741",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF059", "F841", "E501", "SIM117", "SIM222"]

[tool.setuptools.packages.find]
include = ["fusion_model_hub*"]