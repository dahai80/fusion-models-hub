# Step4: PostgreSQL + MinIO backing services for fusion-model-hub integration
# tests (tests/test_integration_pg_minio.py). NOT used by the app at runtime —
# the default deployment is SQLite + local-fs. Brought up only to exercise the
# db_url=postgresql+asyncpg:// and storage_type=minio code paths end-to-end.
#
# Usage (test harness auto-starts/stops this; or manual):
#   docker compose -f tests/integration/docker-compose-pg-minio.yml up -d
#   docker compose -f tests/integration/docker-compose-pg-minio.yml down -v
services:
  fmh-postgres:
    image: postgres:16-alpine
    container_name: fmh-int-pg
    environment:
      POSTGRES_USER: fmh
      POSTGRES_PASSWORD: fmh
      POSTGRES_DB: fmh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmh -d fmh"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  fmh-minio:
    # MinIO removed all free community images (Docker Hub + quay.io, 2026).
    # Chainguard's minio build is the drop-in replacement — same binary, env
    # vars and /minio/health/ready endpoint. The -dev variant carries a
    # busybox shell so the healthcheck can wget (the minimal image is
    # distroless: no mc, no curl, no shell).
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: fmh-int-minio
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
