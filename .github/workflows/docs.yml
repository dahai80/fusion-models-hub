name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (frontmatter must be real YAML, not regex-parseable text)
        run: pip install pyyaml
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-models-hub \
            --class core --entry service \
            --skip-dirs ".git,node_modules,.venv,web,tests,cache,data,logs,helm,alembic,fusion_model_hub"
